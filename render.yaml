services:
  - type: web
    name: lumsic-online
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/readers
    envVars:
      - key: NODE_ENV
        value: production
    disk:
      name: lumsic-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
