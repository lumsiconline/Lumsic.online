name: Container Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - deploy/cloud-run-container

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Install standalone dashboard dependencies
        run: npm install --prefix standalone-apps/astrologer-dashboard
      - name: Build standalone dashboard
        run: npm run build --prefix standalone-apps/astrologer-dashboard
      - name: Build backend container
        run: docker build --tag lumsic-online:test .
