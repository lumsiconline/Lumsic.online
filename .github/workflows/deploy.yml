name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          # URL of the running backend (server.ts), e.g. https://your-backend.example.com
          # Set it in GitHub: Settings > Secrets and variables > Actions > Variables.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          # Supabase project URL and publishable key are public client configuration.
          # Keep Actions secrets as overrides, with safe project-specific defaults so
          # an unset repository secret cannot silently disable all authentication.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://gvbvzvghwjsqisggicmu.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_NkHgQrxAHQoZvBr6ODA3uA_bv878BHh' }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
