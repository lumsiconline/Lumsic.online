<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LUMSIC Admin Command Center</title>
    <meta name="robots" content="noindex, nofollow" />
    <script>
      (function() {
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var path = window.location.pathname || '';
        var idx = path.indexOf('/admin/lumsic.online');
        var base = idx > 0 ? path.substring(0, idx) : '';
        var target = (base || '') + '/admin.html' + search + hash;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body style="background-color: #070A12; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center; max-width: 400px; padding: 20px;">
      <div style="width: 50px; height: 50px; border-radius: 12px; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3); display: flex; align-items: center; justify-content: center; margin: 0 auto 15px auto; color: #F59E0B; font-size: 24px;">
        ✦
      </div>
      <h1 style="font-size: 18px; color: #FFFFFF; margin: 0 0 6px 0; font-weight: 800;">LUMSIC Command Center</h1>
      <p style="font-size: 13px; color: #94A3B8; margin: 0 0 20px 0;">Connecting to secure administrator portal at <strong>admin/lumsic.online</strong>...</p>
      <a href="/admin.html" style="display: inline-block; padding: 10px 22px; background: #F59E0B; color: #070A12; text-decoration: none; border-radius: 10px; font-weight: 700; font-size: 13px;">
        Open Admin Login Screen &rarr;
      </a>
    </div>
  </body>
</html>
